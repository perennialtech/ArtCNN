[project]
name = "artcnn"
version = "0.0.0"
description = "ArtCNN inference, benchmarking, and training scripts"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "numpy",
    "opencv-python-headless<5; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "opencv-python-headless<4.13; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "pillow",
]

[dependency-groups]
inference = [
    "onnxruntime>=1.24; sys_platform != 'darwin'",
    # Keep the wheels for macOS 13 and Intel Macs in the lock.
    "onnxruntime<1.24; sys_platform == 'darwin'",
]
directml = ["onnxruntime-directml; sys_platform == 'win32' and platform_machine == 'AMD64'"]
openvino = [
    "openvino>=2026; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "openvino<2026; sys_platform == 'darwin' and platform_machine == 'x86_64'",
]
onnx = ["onnx", "onnxconverter-common"]
benchmarks = ["matplotlib", "scikit-image", "scipy"]
training = [
    "onnx",
    "scipy",
    "torch==2.8.0; (sys_platform == 'linux' and platform_machine == 'x86_64') or (sys_platform == 'win32' and platform_machine == 'AMD64')",
]
dataset = ["tqdm"]
jax-metrics = ["dm-pix", "jax"]

[tool.uv]
package = false
default-groups = ["inference"]
# Both wheels provide the onnxruntime module.
conflicts = [[{ group = "inference" }, { group = "directml" }]]

[tool.uv.dependency-groups]
# The CUDA 12.8 wheels used by the trainer support these Python versions.
training = { requires-python = ">=3.11,<3.14" }

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
